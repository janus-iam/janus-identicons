name: WASM package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: wasm-package-${{ github.ref }}
  cancel-in-progress: true

env:
  WASM_PKG_DIR: crates/identicon-wasm/pkg

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Build package with wasm-pack
        run: wasm-pack build crates/identicon-wasm --target web --release

      - name: Verify generated package.json
        run: test -f "${{ env.WASM_PKG_DIR }}/package.json"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: identicon-wasm-pkg
          path: ${{ env.WASM_PKG_DIR }}
          if-no-files-found: error

  publish:
    needs: build
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: identicon-wasm-pkg
          path: ${{ env.WASM_PKG_DIR }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Set version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ env.WASM_PKG_DIR }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          bun pm pkg set "version=${VERSION}"

      - name: Publish to npm registry
        working-directory: ${{ env.WASM_PKG_DIR }}
        run: bun publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
